name: Verify & Deploy CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_TIMING_JOB: verify
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      build_sha256: ${{ steps.seal.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: python3 .github/hostinger/measure.py --cache-hit '${{ steps.node.outputs.cache-hit }}' npm-install -- npm --prefix apps/web ci

      - name: Build frontend once
        run: python3 .github/hostinger/measure.py frontend-build -- npm --prefix apps/web run build

      - name: Run frontend unit tests
        run: npm --prefix apps/web test

      - name: Run frontend deterministic benchmark
        run: npm --prefix apps/web run benchmark

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: packages/ml-engine/uv.lock

      - name: Sync Python dependencies
        run: uv --directory packages/ml-engine sync --locked

      - name: Run Python pipeline unit tests
        run: uv --directory packages/ml-engine run python -m unittest discover -s . -p "test_*.py"

      - name: Check deployment shell
        run: |
          bash -n .github/hostinger/remote-deploy.sh
          shellcheck .github/hostinger/remote-deploy.sh

      - name: Seal verified frontend build
        id: seal
        run: python3 .github/hostinger/build_artifact.py seal

      - name: Save verified frontend build
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.run_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Save build and verification timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.repository == 'Andndre/hok-draft-engine' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: 'production'
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    env:
      HOSTINGER_TIMING_JOB: deploy
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      HOSTINGER_TARGET_DIR: ${{ secrets.HOSTINGER_TARGET_DIR }}
      HOSTINGER_RSYNC_BWLIMIT: ${{ secrets.HOSTINGER_RSYNC_BWLIMIT }}
      HOSTINGER_FORCE_VENDOR_SYNC: ${{ secrets.HOSTINGER_FORCE_VENDOR_SYNC }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check Hostinger configuration
        id: preflight
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          from urllib.parse import urlsplit

          config = json.loads(Path('.github/hostinger/profile.json').read_text(encoding='utf-8'))
          deploy_url = (config.get('deploy_url') or '').strip()
          host = urlsplit(deploy_url).hostname or ''
          placeholder_url = not deploy_url or host in {'example.com', 'yourdomain.com'} or host.endswith('.invalid')

          required_secrets = [
              'HOSTINGER_SSH_HOST',
              'HOSTINGER_SSH_USER',
              'HOSTINGER_TARGET_DIR',
              'HOSTINGER_SSH_KEY',
              'HOSTINGER_SSH_KNOWN_HOSTS',
          ]
          missing_secrets = [name for name in required_secrets if not os.environ.get(name, '').strip()]

          out_path = Path(os.environ['GITHUB_OUTPUT'])
          if placeholder_url or missing_secrets:
              print('::notice::Hostinger auto-deploy skipped: configure deploy_url in .github/hostinger/profile.json and HOSTINGER_* repository secrets.')
              with out_path.open('a', encoding='utf-8') as f:
                  f.write('ready=false\n')
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as s:
                      s.write('### Hostinger Auto-Deploy Not Activated Yet\n\n')
                      s.write('Verification passed. To enable automatic Hostinger uploads on pushes to `main`:\n')
                      if placeholder_url:
                          s.write(f'- Set your real public HTTPS URL in `.github/hostinger/profile.json` (`deploy_url` is currently `{deploy_url}`).\n')
                      if missing_secrets:
                          s.write(f'- Configure GitHub repository/environment secrets: `{", ".join(missing_secrets)}` (and optional `HOSTINGER_SSH_PORT`, default `65002`).\n')
              sys.exit(0)

          with out_path.open('a', encoding='utf-8') as f:
              f.write('ready=true\n')
          PY

      - name: Download verified frontend build
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: frontend-artifact/
          merge-multiple: true

      - name: Validate and restore verified build
        if: steps.preflight.outputs.ready == 'true'
        env:
          EXPECTED_BUILD_SHA256: ${{ needs.verify.outputs.build_sha256 }}
        run: python3 .github/hostinger/measure.py artifact-restore -- python3 .github/hostinger/build_artifact.py restore --sha256 "$EXPECTED_BUILD_SHA256"

      - name: Upload immutable chunks & datasets, then publish application
        if: steps.preflight.outputs.ready == 'true'
        id: transfer
        run: python3 .github/hostinger/deploy.py transfer

      - name: Verify deployed HTML and JS/CSS
        if: steps.preflight.outputs.ready == 'true'
        id: verify_http
        run: python3 .github/hostinger/measure.py http-verification -- python3 .github/hostinger/check-deploy.py

      - name: Clean expired deployment assets
        id: cleanup
        if: ${{ !cancelled() && steps.preflight.outputs.ready == 'true' && steps.transfer.outcome == 'success' }}
        env:
          HOSTINGER_HTTP_VERIFIED: ${{ steps.verify_http.outcome == 'success' }}
        run: python3 .github/hostinger/deploy.py cleanup

      - name: Summarize deployment stages
        if: always() && steps.preflight.outputs.ready == 'true'
        env:
          TRANSFER_OUTCOME: ${{ steps.transfer.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_http.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          printf '## Deployment results\n\n| Stage | Result |\n|---|---|\n| Transfer and publication | %s |\n| Public HTTP verification | %s |\n| Asset cleanup | %s |\n\n' "$TRANSFER_OUTCOME" "$VERIFY_OUTCOME" "$CLEANUP_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf 'A failed HTTP check does not establish whether application publication failed. Review its response evidence; no automatic rollback was performed.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Save HTTP diagnostics
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
